<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PTA | Duty register</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f4f5;color:#142d39;font:16px/1.45 'Segoe UI',Arial,sans-serif}header{background:#132f3a;color:white;padding:16px max(5vw,20px);display:flex;align-items:center;gap:15px}header b{background:#ffd349;color:#132f3a;font-size:22px;font-style:italic;padding:3px 10px;border-radius:5px}header span{flex:1}main{max-width:1140px;margin:auto;padding:42px 20px}h1{font-size:clamp(32px,5vw,52px);letter-spacing:-.05em;margin:0}h2{margin:0 0 18px;font-size:23px}p{color:#506774}section,article{background:white;border:1px solid #d1dcdf;border-radius:12px;padding:22px;margin:18px 0}button,input,select,textarea{font:inherit;border-radius:6px;padding:9px 12px;border:1px solid #a4b6bc}button{background:#ffd349;color:#162f39;border-color:transparent;font-weight:650;cursor:pointer}button.secondary{background:#e9eff0}button:disabled{opacity:.5}label{display:grid;gap:5px;font-size:14px;font-weight:600}input,select,textarea{width:100%;background:white;color:#17313e}.grid,.metrics,.actions{display:flex;flex-wrap:wrap;gap:14px;align-items:end}.grid label{flex:1 1 145px}.metrics article{flex:1;min-width:125px;margin:14px 0 0;border-top:4px solid #36706f}.metrics strong{display:block;font-size:30px}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left}td,th{padding:12px 9px;border-bottom:1px solid #dce4e5;white-space:nowrap}th{font-size:13px;color:#4c6570}small{display:block;color:#516975}.pill{border-radius:99px;background:#ebf1f1;padding:3px 10px}.pending{background:#fff0b6}.approved{background:#d5f1df}.rejected{background:#ffdddd}dialog{border:0;border-radius:12px;max-width:400px;width:90%}dialog::backdrop{background:#10252faa}#msg{color:#884000;font-weight:600}#login{max-width:460px}form>*+*{margin-top:14px}[hidden]{display:none!important}</style>
<header><b>PTA</b><span>Training operations</span><button class="secondary" id="exit" hidden>Sign out</button></header><main><h1>Duty register</h1><p id="subtitle">Record duty hours and review overtime and comp-off.</p><p role="status" id="msg"></p>
<section id="login"><h2>Staff sign-in</h2><form id="auth"><label>Work email<input type="email" name="email" required></label><label>Password<input type="password" name="password" required></label><div class="actions"><button>Sign in</button><button type="button" class="secondary" id="demo">Try demo</button></div></form></section>
<div id="panel" hidden><div class="actions" id="switcher" hidden><b>Sample workspace</b><button class="secondary" id="switchRole"></button></div><div class="metrics" id="metrics"></div>
<section id="entry"><h2>New entry</h2><form id="submitDuty"><div class="grid"><label>Duty date<input name="day" type="date" required></label><label>Entry type<select name="kind"><option>Normal duty</option><option>Holiday duty</option><option>Comp-off taken</option></select></label><label>From<input type="time" name="starts" required></label><label>To<input type="time" name="ends" required></label></div><label>Remarks (optional)<input name="note" maxlength="400"></label><button>Submit for review</button></form></section>
<section><div class="actions"><h2>Duty entries</h2><button class="secondary" id="reload">Refresh entries</button></div><div class="scroll"><table><thead><tr><th>Date / trainer</th><th>Duty</th><th>Shift</th><th>OT hours</th><th>Comp-off days</th><th>Status</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section><section><h2>Approved balances</h2><div class="scroll"><table><thead><tr><th>Trainer</th><th>Overtime hours</th><th>Comp-off days available</th></tr></thead><tbody id="balances"></tbody></table></div></section></div></main>
<dialog id="review"><h2>Review duty</h2><p id="details"></p><form id="decision"><label>Overtime hours<input name="ot" type="number" min="0" step=".01" required></label><label>Comp-off days (+ earned / − taken)<input name="credit" type="number" step="1" required></label><div class="actions"><button>Approve</button><button type="button" class="secondary" id="reject">Reject</button><button type="button" class="secondary" id="close">Cancel</button></div><p id="error" role="status"></p></form></dialog>
<script>
const $=id=>document.getElementById(id), staff='sample', manager='lead';
let cfg,token,users=[],entries=[],me,isDemo=false,selected;
const sampleUsers=[{id:staff,name:'Sample Trainer',role:'trainer',opening_days:1},{id:manager,name:'Sample Supervisor',role:'supervisor',opening_days:0}];
const template=[{id:'d1',owner:staff,day:'2026-11-22',kind:'Holiday duty',starts:'07:00',ends:'19:00',status:'Pending',ot:0,days:0,note:'Route familiarization'}];
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';')}
const minutes=s=>Number(s.slice(0,2))*60+Number(s.slice(3,5)), hours=r=>(minutes(r.ends)-minutes(r.starts))/60;
function total(id,key){return entries.filter(r=>r.owner===id&&r.status==='Approved').reduce((n,r)=>n+Number(r[key]),0);}
async function api(path,options={}){let res=await fetch(cfg.url+path,{...options,headers:{apikey:cfg.key,...(token?{Authorization:'Bearer '+token}:{}),'Content-Type':'application/json'}});let body=await res.text();let data=body?JSON.parse(body):null;if(!res.ok)throw Error(data?.message||data?.msg||'Request failed');return data}
async function loadRows(path) {
 const result=[];
 for (;;) {
   const batch=await api(path+'&limit=200&offset='+result.length);
   result.push(...batch);
   if(!batch.length) return result;
 }
}
async function refresh(){if(!isDemo){[users,entries]=await Promise.all([loadRows('/rest/v1/staff?select=*&order=id'),loadRows('/rest/v1/duty?select=*&order=day.desc,id')]);me=users.find(u=>u.id===me.id);if(!me)throw Error('Ask your administrator to assign your staff profile.')}render()}
function render(){let sup=me.role==='supervisor',visible=entries.filter(r=>sup||r.owner===me.id).sort((a,b)=>b.day.localeCompare(a.day)),trainers=users.filter(u=>u.role==='trainer'&&(sup||u.id===me.id));
$('panel').hidden=$('exit').hidden=false;$('login').hidden=true;$('switcher').hidden=!isDemo;$('switchRole').textContent='Switch to '+(sup?'trainer':'supervisor');$('entry').hidden=sup;$('subtitle').textContent=me.name+' · '+(sup?'Supervisor':'Trainer');
const days=u=>u.opening_days+total(u.id,'days');
$('metrics').innerHTML=[[visible.filter(r=>r.status==='Pending').length,'Pending review'],[+trainers.reduce((n,u)=>n+total(u.id,'ot'),0).toFixed(2),'Approved OT hours'],[trainers.reduce((n,u)=>n+days(u),0),'Comp-off days available']].map(([v,k])=>'<article><strong>'+v+'</strong>'+k+'</article>').join('');
$('balances').innerHTML=trainers.map(u=>'<tr><td>'+esc(u.name)+'</td><td>'+total(u.id,'ot').toFixed(2)+'</td><td>'+days(u)+'</td></tr>').join('');
$('rows').innerHTML=visible.map(r=>'<tr><td>'+esc(r.day)+'<small>'+esc(users.find(u=>u.id===r.owner)?.name)+'</small></td><td>'+esc(r.kind)+'<small>'+esc(r.note)+'</small></td><td>'+esc(r.starts.slice(0,5))+' – '+esc(r.ends.slice(0,5))+'<small>'+hours(r).toFixed(2)+' hours</small></td><td>'+(r.status==='Approved'?r.ot:'—')+'</td><td>'+(r.status==='Approved'?r.days:'—')+'</td><td><span class="pill '+r.status.toLowerCase()+'">'+esc(r.status)+'</span></td><td>'+(sup&&r.status==='Pending'?'<button data-id="'+esc(r.id)+'">Review</button>':'')+'</td></tr>').join('')||'<tr><td colspan="7">No entries yet.</td></tr>'}
$('reload').onclick=()=>refresh().catch(err=>{$('msg').textContent=err.message});
$('demo').onclick=()=>{isDemo=true;users=sampleUsers;entries=structuredClone(template);me=users[0];$('msg').textContent='Demo changes last until you exit or refresh.';render()};
$('switchRole').onclick=()=>{me=users[me.role==='trainer'?1:0];render()};$('exit').onclick=()=>location.reload();
$('auth').onsubmit=async e=>{e.preventDefault();try{let response=await fetch('/api/config');if(!response.ok)throw Error();cfg=await response.json()}catch{$('msg').textContent='Staff sign-in needs a configured deployment. You can try the demo here.';return}try{token=null;let data=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});token=data.access_token;me=data.user;await refresh();e.target.reset();$('msg').textContent=''}catch(err){$('msg').textContent=err.message}};
$('submitDuty').onsubmit=async e=>{e.preventDefault();const form=e.target,r=Object.fromEntries(new FormData(form));try{if(hours(r)<=0)throw Error('End time must follow start time on the same day.');if(isDemo){if(entries.some(x=>x.owner===me.id&&x.day===r.day&&x.status!=="Rejected"))throw Error('A duty entry already exists for this date.');entries.push({...r,id:crypto.randomUUID(),owner:me.id,status:'Pending',ot:0,days:0})}else await api('/rest/v1/duty',{method:'POST',body:JSON.stringify(r)});await refresh();form.reset();$('msg').textContent='Duty entry submitted for review.'}catch(err){$('msg').textContent=err.message}};
$('rows').onclick=e=>{const r=entries.find(x=>x.id===e.target.dataset.id);if(!r)return;selected=r;let h=hours(r),holiday=r.kind==='Holiday duty';$('details').textContent=r.day+' · '+r.kind+' · '+h.toFixed(2)+' hours. '+r.note;$('decision').credit.value=holiday?Math.floor(h/8):r.kind==='Comp-off taken'?-1:0;$('decision').ot.value=holiday?+(h%8).toFixed(2):r.kind==='Normal duty'?+Math.min(3.5,Math.max(0,h-8.5)).toFixed(2):0;$('error').textContent='';$('review').showModal()};
async function decide(decision){const r=selected,ok=decision==='Approved',ot=ok?Number($('decision').ot.value):0,days=ok?Number($('decision').credit.value):0;try{if(isDemo){let balance=users.find(u=>u.id===r.owner).opening_days+total(r.owner,'days');if(ok&&(ot<0||ot>hours(r)||!Number.isInteger(days)||(r.kind==='Normal duty'&&(ot>3.5||days!==0))||(r.kind==='Holiday duty'&&(days<0||days*8+ot>hours(r)))||(r.kind==='Comp-off taken'&&(days!==-1||ot!==0||balance<1))))throw Error('Check overtime, comp-off allocation and available balance.');Object.assign(r,{status:decision,ot,days})}else await api('/rest/v1/rpc/review',{method:'POST',body:JSON.stringify({entry:r.id,decision,overtime:ot,credit:days})});await refresh();$('review').close();$('msg').textContent='Entry '+decision.toLowerCase()+'.'}catch(err){$('error').textContent=err.message}}
$('decision').onsubmit=e=>{e.preventDefault();decide('Approved')};$('reject').onclick=()=>decide('Rejected');$('close').onclick=()=>$('review').close();
</script></html>
